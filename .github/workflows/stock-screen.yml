name: Daily stock screen

# Re-runs the Moat Finder screen and commits stock_tracker/data/results.csv, so the dashboard always has
# fresh data. Free: standard GitHub-hosted runners cost nothing on public repositories.
#
# Timing (cron is in UTC):
# - Tuesday to Saturday, i.e. after each Monday-Friday market close; markets are shut on weekends.
# - 07:17 / 07:47 UTC is about 2-3 a.m. in Toronto and New York (3:17 EDT, 2:17 EST): the previous close is
#   final, and Yahoo, Google, Finviz and SEC EDGAR see little traffic.
# - Odd minutes avoid the top of the hour, when GitHub delays or drops scheduled runs.
# - Canada (~220 stocks) and the USA (~500) run 30 minutes apart, so no site sees all ~720 requests at once.
on:
  schedule:
    - cron: "17 7 * * 2-6" # Canada
    - cron: "47 7 * * 2-6" # USA
  workflow_dispatch:
    inputs:
      countries:
        description: Which countries to screen
        type: choice
        options: ["USA Canada", "USA", "Canada"]
        default: "USA Canada"

permissions:
  contents: write # to commit the refreshed results

concurrency:
  group: stock-screen # never two screens at once; the second waits
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stock_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_tracker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keep downloaded data between runs: fundamentals and SEC filings are reused for 7 days, so most
      # days only prices are fetched again. That is the biggest protection against throttling.
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: stock_tracker/cache
          key: screener-cache-${{ github.run_id }}
          restore-keys: screener-cache-

      - name: Choose countries
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.countries }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then countries="$INPUT"
          elif [ "$SCHEDULE" = "17 7 * * 2-6" ]; then countries="Canada"
          else countries="USA"; fi
          echo "countries=$countries" >> "$GITHUB_OUTPUT"

      # Two workers instead of four: GitHub's shared IP addresses are throttled sooner than a home connection.
      # If fewer than 80% of stocks can be scored, the run fails and the previous results are kept.
      - name: Run the screen
        env:
          COUNTRIES: ${{ steps.pick.outputs.countries }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -m buffett --countries $COUNTRIES --workers 2 --min-success 0.8

      - name: Commit results
        env:
          COUNTRIES: ${{ steps.pick.outputs.countries }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Daily stock screen: $COUNTRIES ($(date -u +%F))"
          git pull --rebase
          git push
